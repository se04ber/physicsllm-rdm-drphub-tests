version: 0.9.0

# DeepEval over real A_Data: our own extraction output scored against the
# published SciCat record for the same dataset. Neither side is a fixture.
#
# Runs on the stock python image - no harness image, no MCP server, no S4P,
# no secrets. The two JSON files it needs travel with the card.
#
# DeepEval is installed at run time. If the job has no outbound network the
# install fails, the script says so, and the same comparison is still computed
# and reported - so the card produces a verdict either way.

inputs:
  files:
    - run_deepeval.py
    - data/golden_label.json
    - data/mapped_header_draft.json
    - data/SOURCE.json
    - manifest.json
    - LICENSE
    - CITATION.cff

workflow:
  type: serial
  specification:
    steps:
      - name: install
        environment: 'python:3.12-slim'
        commands:
          # The C4P job runs with an unwritable HOME - the first real run died
          # on [Errno 13] Permission denied: '/.local' when pip fell back to
          # the user site directory. Install into the workspace instead, which
          # the next step picks up via PYTHONPATH. Never fail the run on this:
          # the script reports the absence and computes the same verdict.
          - HOME="$PWD" pip install --no-cache-dir --quiet --target "$PWD/.deps" deepeval || echo "deepeval install failed - continuing without it"

      - name: score
        environment: 'python:3.12-slim'
        commands:
          - HOME="$PWD" PYTHONPATH="$PWD/.deps" DEEPEVAL_TELEMETRY_OPT_OUT=YES python run_deepeval.py --data data --out results

outputs:
  files:
    - results/deepeval_report.json
