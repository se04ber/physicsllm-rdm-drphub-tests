version: 0.9.0

# DeepEval over real A_Data: our own extraction output scored against the
# published SciCat record for the same dataset. Neither side is a fixture.
#
# Runs on the stock python image - no harness image, no MCP server, no S4P,
# no secrets. The two JSON files it needs travel with the card.
#
# DeepEval is installed at run time. If the job has no outbound network the
# install fails, the script says so, and the same comparison is still computed
# and reported - so the card produces a verdict either way.

inputs:
  files:
    - run_deepeval.py
    - eval_live.py
    - data/routing_cases.jsonl
    - data/panet_cases.jsonl
    - eval_benchmark.py
    - benchmark/TestBenchmark_PaN/config_user_group.json
    - benchmark/TestBenchmark_PaN/datasets/c5_metadata_suggestion/p08_reflectivity/cases.jsonl
    - data/golden_label.json
    - data/mapped_header_draft.json
    - data/SOURCE.json
    - manifest.json
    - LICENSE
    - CITATION.cff

  parameters:
    mcp_base: https://physicsllm-rdm.desy.de:8443
    # The server's certificate is self-signed until the official one lands;
    # set this back to "verify" then, and a green run proves it worked.
    tls_mode: insecure

workflow:
  type: serial
  specification:
    steps:
      - name: install
        environment: 'python:3.12-slim'
        commands:
          # Never fail the run on the install: the script reports its absence.
          - HOME=/tmp pip install --no-cache-dir --quiet --target .deps deepeval || echo "deepeval install failed - continuing without it"

      - name: score
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp PYTHONPATH=.deps DEEPEVAL_TELEMETRY_OPT_OUT=YES python run_deepeval.py --data data --out results

      # The benchmark tree, scored where it lies. Needs no dCache and no
      # MCP server - the layout is the same whether the tree is a local
      # mirror or the real one.
      - name: benchmark
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp PYTHONPATH=.deps python eval_benchmark.py --tree benchmark --write-results

      # Ask the running system to decide something now, rather than only
      # scoring a draft produced earlier. Skips cleanly without a token.
      - name: live
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp PYTHONPATH=.deps python eval_live.py --base ${mcp_base} --tls ${tls_mode} --data data --out results

outputs:
  files:
    - results/deepeval_report.json
    - results/live_routing.json
    - results/benchmark_report.json
