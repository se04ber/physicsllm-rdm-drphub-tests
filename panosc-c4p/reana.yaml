version: 0.1.0

# Reach the DESY RDM MCP server from a Compute4PUNCH job.
#
# physicsllm-rdm.desy.de:8443 is not meant to be publicly reachable. The DESY
# pin below is therefore part of the experiment rather than an accident: it is
# what puts the job inside the network where the server can be reached at all.
#
# Since 2026-09-21 the host serves a GEANT certificate, so tls_mode is "verify".
# Reachability and certificate validity are separate questions, and the earlier
# self-signed certificate confused them: it made verifying clients fail in a way
# that looked like a firewall. Directives follow the working C4P template in
# C4Compute/c4_compute/reana_templates/c5_health_probe/reana-c4p.yaml.
#
# Prerequisite: the compute4punch backend needs HELMHOLTZ_TOP in the REANA
# secret store. Check with `reana-client secrets-list` before submitting.
#
# Standard library only: the first real C4P run showed pip cannot write to
# HOME on this backend, so a card that needs an install is a card that
# does not run.

inputs:
  files:
    - probe_mcp.py
  parameters:
    mcp_base: https://physicsllm-rdm.desy.de:8443
    query: reflectivity
    limit: 5
    # The GEANT chain is in the public trust store, so wlcg-wn verifies it
    # with no CA bundle added. "insecure" remains available for a lapsed
    # certificate, at the cost of a result that carries a caveat.
    tls_mode: verify

workflow:
  type: serial
  specification:
    steps:
      - name: probe
        environment: "wlcg-wn:latest"
        compute_backend: compute4punch
        c4p_cpu_cores: "1"
        c4p_memory_limit: "512"
        # Pin to DESY. The server is not publicly reachable, so this is what
        # puts the job inside the network where it can reach it at all. It does
        # shrink the pool of eligible drones, which is the likeliest reason an
        # earlier run sat unscheduled for 18 minutes at 0/2, so give a run a
        # time budget rather than assuming it schedules promptly.
        c4p_additional_requirements: 'regexp("desy",Target.TardisDroneUuid)'
        commands:
          - mkdir -p results
          - python3 probe_mcp.py --base ${mcp_base} --tls ${tls_mode} --query "${query}" --limit ${limit} --out results

outputs:
  files:
    - results/mcp_probe.json
