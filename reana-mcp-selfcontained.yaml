version: 0.9.0

# The MCP server and its evaluation, in one REANA job.
#
# Why this exists. The deployed server at physicsllm-rdm.desy.de is not
# publicly reachable: a run on the default backend on 2026-09-21 went green
# having measured nothing, failing the handshake with "[Errno 101] Network is
# unreachable". The backend that can reach it, compute4punch, accepts only
# wlcg-wn:latest, so a card cannot bring its own image there either.
#
# This card sidesteps both by bringing the server with it. ghcr.io/se04ber/
# rdm-mcp became publicly pullable on 2026-09-21, and it contains the MCP
# server. The job starts it on loopback and measures against it, so the whole
# stack runs on REANA with no dependency on reaching DESY.
#
# What it demonstrates: the server, the nine-tool surface, every case, and
# per-call latency, all under REANA. What it does not demonstrate: that the
# deployed instance is reachable. That is reana-mcp-c4p.yaml's job.
#
# The token lines up for free. The server reads RDM_MCP_BEARER_TOKEN and so
# does the card, so one secret authenticates both ends.

inputs:
  files:
    - run_card.py
    - mcp_client.py
    - serve_and_measure.sh
  directories:
    - benchmark
  parameters:
    suite_path: benchmark/TestBenchmark_PaN
    port: "8000"

workflow:
  type: serial
  specification:
    steps:
      - name: serve-and-measure
        environment: 'ghcr.io/se04ber/rdm-mcp:latest'
        commands:
          # The shell lives in serve_and_measure.sh: REANA substitutes ${...}
          # in step commands, so an inline loop using $(...) or $i dies with
          # "Invalid placeholder in string" before anything runs.
          - sh serve_and_measure.sh ${port} ${suite_path}

outputs:
  files:
    - results/mcp_card_report.json
    - results/otel_summary.json
    - results/server.log
