version: 0.9.0

# Route B: evaluate a benchmark folder that lives on dCache.
#
# This is the community path: a group uploads a bundle to the VO space and a
# REANA job fetches and scores it, with no copy in this repository and no
# manual step between the upload and the verdict.
#
# Reachability was measured rather than assumed. On 2026-09-21 the S4P
# preflight card ran on a REANA node and reached all three dCache doors by
# DNS, TCP and OPTIONS.
#
# The storage credential is a dCache macaroon, which suits this better than an
# IdP token would: it carries a path caveat and an expiry, so the credential
# itself is bounded to the tree it may read. It stands in for a PUNCH token
# until the IdP grants storage scopes; see the tutorial for why.

inputs:
  files:
    - eval_harness.py
    - counting_proxy.py
    - fetch_dcache.py
  parameters:
    dcache_base: https://dcache-doma-door01.desy.de/punch/physicsllm/01Benchmarks
    tree: benchmark
    repeats: "3"
    eval_llm_base_url: https://api.helmholtz-blablador.fz-juelich.de/v1
    eval_llm_auth_header: Authorization

workflow:
  type: serial
  specification:
    steps:
      - name: install
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp timeout 180 pip install --no-cache-dir --progress-bar off --target .deps opentelemetry-sdk opentelemetry-api || echo "opentelemetry unavailable - latency will be not_available"
          - HOME=/tmp timeout 600 pip install --no-cache-dir --progress-bar off --target .deps deepeval==4.2.3 || echo "deepeval unavailable - continuing with deterministic tiers"

      - name: fetch
        environment: 'python:3.12-slim'
        commands:
          # Exits 0 with a finding when DCACHE_BEARER_TOKEN is absent, so a
          # missing secret reads as "not set up yet" rather than a failure.
          - python fetch_dcache.py --base ${dcache_base} --out ${tree}

      - name: evaluate
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp PYTHONPATH=.deps DEEPEVAL_TELEMETRY_OPT_OUT=YES EVAL_LLM_BASE_URL=${eval_llm_base_url} EVAL_LLM_AUTH_HEADER=${eval_llm_auth_header} python eval_harness.py --tree ${tree} --repeats ${repeats} --out results

outputs:
  files:
    - results/fetch_report.json
    - results/eval_report.json
