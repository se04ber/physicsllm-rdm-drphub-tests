version: 0.9.0

# Exercise the live MCP server, score its answers with DeepEval, and measure
# every call with OpenTelemetry.
#
# Runs on the stock python image. No harness image, because every
# ghcr.io/se04ber image is HTTP 403 anonymously and REANA on C4P cannot pull
# one. No S4P mount is needed either: the benchmark tree travels with the
# card, in the same layout the real tree has in dCache.
#
# NOTHING SECRET IS COMMITTED HERE, and nothing may be. The DRP-Hub launcher
# clones this repository's default branch anonymously, so the bearer token
# has to come from the REANA secret store instead:
#
#   reana-client secrets-add --env RDM_MCP_BEARER_TOKEN=<the secret>
#
# Without it the run reports "no token", every case comes out not-scored,
# and a report is still written. A missing credential is not a broken card.

inputs:
  files:
    - mcp_client.py
    - run_card.py
    - build_cases.py
    - benchmark/TestBenchmark_PaN/config_user_group.json
    - benchmark/TestBenchmark_PaN/use_cases/c5_mcp_tool_surface/system.json
    - benchmark/TestBenchmark_PaN/datasets/c5_mcp_tool_surface/rdm_mcp_live/cases.jsonl
    - manifest.json
    - LICENSE
    - CITATION.cff

  parameters:
    mcp_base: https://physicsllm-rdm.desy.de:8443

    # The host serves a GEANT TLS ECC 1 certificate that chains to the HARICA
    # 2021 root, which is in the public trust store, so the job needs no CA
    # bundle of its own. "insecure" still works if the certificate lapses,
    # but a run that needs it is a run whose result carries a caveat.
    tls_mode: verify

    # The suite to score. Either a tree holding several suites, which is the
    # local mirror's shape, or one suite directory, which is what an S4P
    # mount of a single suite looks like. Both are recognised by where
    # datasets/ sits.
    suite_path: benchmark/TestBenchmark_PaN

workflow:
  type: serial
  specification:
    steps:
      - name: install
        environment: 'python:3.12-slim'
        commands:
          # Never fail the run on an install. The report records what was
          # missing, and the comparison is computed either way.
          #
          # --target .deps rather than a user install: the C4P job has no
          # writable HOME, so the wheels go into the workspace.
          - HOME=/tmp pip install --no-cache-dir --quiet --target .deps deepeval==4.2.3 || echo "deepeval install failed - continuing without deepeval"
          - HOME=/tmp pip install --no-cache-dir --quiet --target .deps opentelemetry-sdk opentelemetry-api || echo "opentelemetry install failed - continuing without spans; latencies are still measured"

      - name: measure
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp PYTHONPATH=.deps DEEPEVAL_TELEMETRY_OPT_OUT=YES python run_card.py --tree ${suite_path} --base ${mcp_base} --tls ${tls_mode} --out results --write-results

outputs:
  files:
    - results/mcp_card_report.json
    - results/otel_summary.json
    - results/otel_spans.json
