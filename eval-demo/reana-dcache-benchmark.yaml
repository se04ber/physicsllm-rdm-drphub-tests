version: 0.9.0

# Evaluate a benchmark that lives on dCache.
#
# This is the community path end to end: someone uploads a bundle to the VO
# space, and a REANA job fetches it and scores it. No copy of their data in
# this repository, and no manual step between the upload and the verdict.
#
# Reachability is measured rather than assumed. On 2026-09-21 the S4P
# preflight card ran on a REANA node and reached all three dCache doors, DNS,
# TCP and OPTIONS, from the same node that could not open a TCP connection to
# physicsllm-rdm.desy.de. Storage works from REANA; our MCP server does not.
#
# The credential is a dCache macaroon in DCACHE_BEARER_TOKEN, from the REANA
# secret store. A macaroon suits this: it carries a path caveat and an expiry,
# so the credential is bounded to the tree it may read rather than relying on
# the job to behave.
#
#   reana-client secrets-add --env DCACHE_BEARER_TOKEN=<macaroon>

inputs:
  files:
    - fetch_dcache.py
    - evaluate.py
    - counting_proxy.py
  parameters:
    dcache_base: https://dcache-doma-door01.desy.de/punch/physicsllm/01Benchmarks
    tree: benchmark

workflow:
  type: serial
  specification:
    steps:
      - name: install
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp timeout 600 pip install --no-cache-dir --progress-bar off --target .deps deepeval || echo "deepeval unavailable - continuing with deterministic tiers"

      - name: fetch
        environment: 'python:3.12-slim'
        commands:
          # Exits 0 with a finding when the token is absent, so a missing
          # secret reads as "not set up yet" rather than a broken card.
          - python fetch_dcache.py --base ${dcache_base} --out ${tree}

      - name: evaluate
        environment: 'python:3.12-slim'
        commands:
          # evaluate.py rather than eval_benchmark.py: the latter globs for
          # exactly <suite>/datasets/<use_case>/<dataset>/cases.jsonl, so a
          # community bundle in any other shape is fetched and then silently
          # ignored. Observed on 2026-09-21: 51 files came down from
          # 01Benchmarks and only one of the two bundles was scored.
          # Deliberately no --allow-exec. This tree came off shared storage,
          # so any VO member could have written the system.json in it, and
          # this job holds DCACHE_BEARER_TOKEN and EVAL_LLM_API_KEY. A
          # fetched bundle gets scored, never run.
          - HOME=/tmp PYTHONPATH=.deps DEEPEVAL_TELEMETRY_OPT_OUT=YES python evaluate.py --tree ${tree} --out results

outputs:
  files:
    - results/fetch_report.json
    - results/eval_report.json
