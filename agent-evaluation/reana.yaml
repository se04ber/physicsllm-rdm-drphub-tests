version: 0.9.0

# Evaluate an agent on a test folder. Everything is set in that folder's
# config.json; the only parameter here is which folder.
#
# Secrets come from the REANA store, never from the repository:
#   reana-client secrets-add --env EVAL_LLM_API_KEY=<key>       for a model
#   reana-client secrets-add --env DCACHE_BEARER_TOKEN=<macaroon>  for storage: dcache

inputs:
  files:
    - run.py
  directories:
    - evalwrap
    - example
  parameters:
    test_folder: example

workflow:
  type: serial
  specification:
    steps:
      - name: install
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp timeout 180 pip install --no-cache-dir --progress-bar off --target .deps opentelemetry-sdk opentelemetry-api || echo "opentelemetry unavailable, latency will be not_available"
          - HOME=/tmp timeout 600 pip install --no-cache-dir --progress-bar off --target .deps deepeval==4.2.3 || echo "deepeval unavailable, correctness is computed locally"

      - name: evaluate
        environment: 'python:3.12-slim'
        commands:
          - HOME=/tmp PYTHONPATH=.deps DEEPEVAL_TELEMETRY_OPT_OUT=YES python run.py ${test_folder} --out results

outputs:
  directories:
    - results
