version: 0.1.0

# Reach the DESY RDM MCP server from a Compute4PUNCH job.
#
# physicsllm-rdm.desy.de:8443 answers from outside DESY. The earlier belief
# that it was intranet-only came from its self-signed certificate, which made
# every verifying client fail in a way that looks like a firewall. Since
# 2026-09-21 it serves a GEANT certificate and verifies cleanly, so the job
# no longer has to run inside the DESY network. Directives follow the working
# C4P template in C4Compute/c4_compute/reana_templates/c5_health_probe/reana-c4p.yaml.
#
# Prerequisite: the compute4punch backend needs HELMHOLTZ_TOP in the REANA
# secret store. Check with `reana-client secrets-list` before submitting.
#
# Standard library only: the first real C4P run showed pip cannot write to
# HOME on this backend, so a card that needs an install is a card that
# does not run.

inputs:
  files:
    - probe_mcp.py
  parameters:
    mcp_base: https://physicsllm-rdm.desy.de:8443
    query: reflectivity
    limit: 5
    # The GEANT chain is in the public trust store, so wlcg-wn verifies it
    # with no CA bundle added. "insecure" remains available for a lapsed
    # certificate, at the cost of a result that carries a caveat.
    tls_mode: verify

workflow:
  type: serial
  specification:
    steps:
      - name: probe
        environment: "wlcg-wn:latest"
        compute_backend: compute4punch
        c4p_cpu_cores: "1"
        c4p_memory_limit: "512"
        # No DESY pin. It was added when we thought the server was
        # intranet-only; it is not, and pinning only shrinks the pool of
        # eligible drones, which is the likeliest reason the first run sat
        # unscheduled for 18 minutes at 0/2. Restore the line below only if
        # the point of a run is "a DESY drone reaches a DESY service" rather
        # than "the capability is reachable".
        #   c4p_additional_requirements: 'regexp("desy",Target.TardisDroneUuid)'
        commands:
          - mkdir -p results
          - python3 probe_mcp.py --base ${mcp_base} --tls ${tls_mode} --query "${query}" --limit ${limit} --out results

outputs:
  files:
    - results/mcp_probe.json
